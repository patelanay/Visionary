version: '3.8'

services:
  visionary-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionary_api_server
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Visionary
      - DEBUG=True
      - PORT=8000
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URI=mongodb://mongodb:27017/visionary
      - ENABLE_MOCK_FALLBACK=True
    depends_on:
      - redis
      - mongodb
    networks:
      - visionary-network

  redis:
    image: redis:7-alpine
    container_name: visionary_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - visionary-network

  mongodb:
    image: mongo:6.0
    container_name: visionary_mongodb_atlas
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - visionary-network

networks:
  visionary-network:
    driver: bridge

volumes:
  redis_data:
  mongo_data:
